# Runner pin: jobs use ubuntu-24.04, not ubuntu-latest. ubuntu-latest now
# resolves to Ubuntu 26.04, where the Playwright chromium install and the
# Pa11y browser launch fail. Revisit once Playwright supports 26.04.

# Security checks: Semgrep, Trivy, gitleaks secret detection, and dependency review.
#
# Action versions were verified against GitHub and pinned to commit SHAs
# on 2026-05-21. The version tag is in the trailing comment.

name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # weekly, Monday morning

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    runs-on: ubuntu-24.04
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Cache pip packages for Semgrep
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-semgrep-1.166.0
      - name: Semgrep
        # semgrep scan runs locally with the default ruleset and exits non-zero
        # on any finding. semgrep ci requires a SEMGREP_APP_TOKEN and uses
        # cloud-based CI mode; it is not used here to avoid token dependency.
        run: |
          pip install semgrep==1.166.0
          semgrep scan --config p/default --error

  trivy:
    runs-on: ubuntu-24.04
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: '1'

  # ── gitleaks ────────────────────────────────────────────────────────────────
  # Secret detection that needs no paid GitHub Advanced Security. Native secret
  # scanning is GHAS-gated on private repositories, so this job is the free
  # equivalent. It runs the open-source gitleaks binary (MIT licence), not the
  # gitleaks-action wrapper: the wrapper needs a licence key for organisation
  # accounts (GITLEAKS_LICENSE) and posts pull request comments, while the
  # binary needs no key under any account type and sends nothing anywhere.
  # Scope: pull requests scan only the commits the PR adds; pushes to main and
  # the weekly run scan the full history. Any finding fails the job. --redact
  # masks every secret value in the log, so a leak is never reprinted;
  # --verbose prints each finding (rule, file, line, commit) so it can be fixed.
  # To allow a known false positive, add a .gitleaks.toml at the repository
  # root (gitleaks reads it automatically); see docs/patterns/private-repo-github-actions.md.
  # The release archive is verified against a pinned SHA-256 before it runs.
  # Update version and checksum together, from the release's checksums file.
  # ─────────────────────────────────────────────────────────────────────────────
  gitleaks:
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  # gitleaks_8.30.1_linux_x64.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # gitleaks reads git history, so a shallow clone would hide commits
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          mkdir "${RUNNER_TEMP}/gitleaks-bin"
          tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" --directory "${RUNNER_TEMP}/gitleaks-bin" gitleaks
      - name: Scan for secrets
        env:
          # Event data goes through env, never straight into the script.
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # No --verbose: it prints each commit's author name and email. The JSON
          # report is redacted, stays in RUNNER_TEMP, and is never uploaded.
          report="${RUNNER_TEMP}/gitleaks-report.json"
          args=(git --redact --no-banner --no-color --report-format json --report-path "${report}")
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            args+=(--log-opts="${PR_BASE_SHA}..${PR_HEAD_SHA}")
          fi
          rc=0
          "${RUNNER_TEMP}/gitleaks-bin/gitleaks" "${args[@]}" . || rc=$?
          if [ -s "${report}" ]; then
            jq -r '.[] | "\(.RuleID) \(.File):\(.StartLine) commit \(.Commit[0:12])"' "${report}"
          fi
          exit "${rc}"

  # ── dependency-review ───────────────────────────────────────────────────────
  # dependency-review requires GitHub Advanced Security. On a private repository
  # without it, the action fails with a 403 error. The job is kept for the
  # signal it gives on public repos and where Advanced Security is enabled, but
  # is marked continue-on-error so it never blocks a merge on a private repo
  # that lacks the feature. Trivy and Semgrep remain the blocking security gates.
  # ─────────────────────────────────────────────────────────────────────────────
  dependency-review:
    runs-on: ubuntu-24.04
    continue-on-error: true
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        # There is nothing to diff without a manifest and lockfile; skip
        # rather than fail or no-op unpredictably on a static-content
        # project. hashFiles is only valid at step level, not job level, so
        # the gate lives here rather than on the job's own "if:". Semgrep
        # and Trivy above need no such gate; both are filesystem scans that
        # already work without a manifest.
        if: hashFiles('package.json') != '' || hashFiles('composer.json') != ''

  # Note for PHP projects: CodeQL does not support PHP. Add a PHP static
  # analysis job here, for example PHPStan or Psalm, in place of CodeQL.
