# Runner pin: jobs use ubuntu-24.04, not ubuntu-latest. ubuntu-latest now
# resolves to Ubuntu 26.04, where the Playwright chromium install and the
# Pa11y browser launch fail. Revisit once Playwright supports 26.04.

# Playwright accessibility tests for the built browser extension.
#
# This file is customised for this project and is listed in
# .claude/workflows-protect so a template sync does not overwrite it.
#
# The two real tests in tests/accessibility/ load the built extension into
# Chrome for Testing and run axe-core against the popup and report pages.
# The extension must be built first, because the tests load it from the
# repository root. The tests launch Chrome with --headless=new and
# headless: false, so xvfb-run supplies the virtual display.
#
# Action versions were verified against GitHub and pinned to commit SHAs
# on 2026-06-02. The version tag is shown in the trailing comment. To
# update an action, change the SHA and the comment together.
#
# Relationship to accessibility.yml: for the browser-extension archetype
# that workflow skips its tool steps and relies on this one to carry the
# accessibility gate.

name: Playwright
on:
  pull_request:

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        # Runs the project's postinstall step (scripts/copy-models.mjs).
        run: npm ci

      - name: Build the extension
        run: npm run build

      - name: Install Chrome for Testing
        # --with-deps installs system dependencies on the runner. Playwright
        # 1.63 installs Chrome for Testing as its chromium browser.
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: xvfb-run --auto-servernum npm test

      - name: Upload Playwright report
        # Upload the HTML report as an artifact on failure so it can be
        # inspected without re-running the tests.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
