# Dependabot configuration.
# Weekly, grouped dependency updates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      javascript:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /ci-tools/lint-tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      lint-tools:
        patterns: ["*"]

  # Added during the 058 ci-tools move: this project had no entry for the
  # accessibility tools folder, so Dependabot never watched it.
  - package-ecosystem: npm
    directory: /ci-tools/accessibility-tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      accessibility-tools:
        patterns: ["*"]
